replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.2"
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # Avoid flapping: wait before removing pods after a spike.
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
